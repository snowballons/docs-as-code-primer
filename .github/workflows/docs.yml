name: docs (primer repo)

on:
  push:
    paths:
      - "primer/**"
      - "templates/**"
      - "appendix/**"
      - "recipes/**"
      - "examples/**"
      - "docs/**"
      - "public/**"
      - "*.md"
      - "blume.config.ts"
      - "package.json"
      - ".github/workflows/docs.yml"
      - ".rumdl.toml"
      - ".cspell.json"
      - "docs/spelling-exceptions.txt"
    branches:
      - main
  pull_request:
    paths:
      - "primer/**"
      - "templates/**"
      - "appendix/**"
      - "recipes/**"
      - "examples/**"
      - "docs/**"
      - "public/**"
      - "*.md"
      - "blume.config.ts"
      - "package.json"
      - ".github/workflows/docs.yml"
      - ".rumdl.toml"
      - ".cspell.json"
      - "docs/spelling-exceptions.txt"

# Allow one deployment at a time
concurrency:
  group: "pages"
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  lint-and-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Markdown lint
        uses: rvben/rumdl@v0
        with:
          config: .rumdl.toml
          report-type: annotations

      - name: Link check
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --root .
            --include '^https?://'
            --exclude 'https?://localhost'
            --exclude 'https?://.*\\.local'
            --exclude 'https?://.*\\.internal'
            --exclude 'https?://status\\.acme\\.io'
            --exclude '\[owner\]'
            --exclude 'alexanderfashakin\\.substack\\.com'
            "primer/**/*.md"
            "templates/**/*.md"
            "appendix/**/*.md"
            "recipes/**/*.md"
            "docs/**/*.md"
            "examples/**/*.md"
            "*.md"
          fail: true

      - name: Spell check
        uses: streetsidesoftware/cspell-action@v6
        with:
          files: |
            primer/**/*.md
            templates/**/*.md
            appendix/**/*.md
          config: .cspell.json
          incremental_files_only: false

  cross-references:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check template references from primer resolve
        run: |
          set -euo pipefail
          errors=0
          for f in primer/*.md; do
            while read -r ref; do
              tmpl=$(echo "$ref" | sed 's|\.\./templates/||').md
              if [ ! -f "templates/$tmpl" ]; then
                echo "ERROR: $f references templates/$tmpl which does not exist"
                errors=$((errors + 1))
              fi
            done < <(grep -oP '\.\./templates/[\w-]+(?=\.md)' "$f" 2>/dev/null || true)
          done
          if [ "$errors" -gt 0 ]; then exit 1; fi
          echo "All primer template references resolve."

  mermaid-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install mermaid-cli
        run: npm install --no-save @mermaid-js/mermaid-cli
      - name: Render .mmd files (fails on invalid diagrams)
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -name '*.mmd' -not -path './.git/*' -print)
          if [ ${#files[@]} -eq 0 ]; then echo "No .mmd files"; exit 0; fi
          for f in "${files[@]}"; do
            npx mmdc -i "$f" -o /tmp/mermaid-out.svg
          done

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: [lint-and-links, cross-references, mermaid-check]
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npx blume build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
