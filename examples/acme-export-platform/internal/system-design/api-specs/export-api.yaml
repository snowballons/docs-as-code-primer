openapi: 3.0.3
info:
  title: Acme Export API
  version: 1.0.0
  description: Sample canonical OpenAPI for the Docs-as-Code Primer example (not a real service).
paths:
  /v1/exports:
    post:
      operationId: createExport
      summary: Create an export job
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExportRequest'
            example:
              from: '2026-01-01'
              to: '2026-01-31'
              format: csv
      responses:
        '202':
          description: Job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJob'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden — missing entitlement
        '422':
          description: Invalid date range or format
  /v1/exports/{job_id}:
    get:
      operationId: getExport
      summary: Get export job status
      security:
        - bearerAuth: []
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Current job state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJob'
        '404':
          description: Unknown job
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    CreateExportRequest:
      type: object
      required: [from, to, format]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        format:
          type: string
          enum: [csv, json, xlsx]
    ExportJob:
      type: object
      required: [job_id, status]
      properties:
        job_id:
          type: string
        status:
          type: string
          enum: [queued, running, completed, failed]
        download_url:
          type: string
          format: uri
          nullable: true
