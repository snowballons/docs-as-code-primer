name: docs

on:
  push:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
      - ".rumdl.toml"
      - ".cspell.json"
      - "docs/spelling-exceptions.txt"
      - ".lycheeignore"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
      - ".rumdl.toml"
      - ".cspell.json"
      - "docs/spelling-exceptions.txt"
      - ".lycheeignore"

jobs:
  lint-and-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Markdown lint
        uses: rvben/rumdl@v0
        with:
          config: .rumdl.toml
          report-type: annotations

      - name: Link check
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --root-dir .
            "docs/**/*.md"
          fail: true

